<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        a { display: inline-block; padding: 6px 12px; text-decoration: none; border-radius: 4px; color: white; }
        .btn-add { background: #28a745; margin-bottom: 15px; }
        .btn-edit { background: #ffc107; color: #000; }
        .btn-delete { background: #dc3545; }
    </style>
</head>
<body>

    <h2>Student Details</h2>
    <a href="{% url 'add_student' %}" class="btn-add">+ Add New Student</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.phone }}</td>
            <td>{{ student.course }}</td>
            <td>
                <!-- Edit & Delete Buttons with Student ID -->
                <a href="{% url 'edit_student' student.id %}" class="btn-edit">Edit</a>
                <a href="{% url 'delete_student' student.id %}" class="btn-delete">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="6">No students added yet.</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
