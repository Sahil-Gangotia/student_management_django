<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Student</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .card { max-width: 400px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        button { background-color: #dc3545; color: white; padding: 8px 15px; border: none; cursor: pointer; border-radius: 4px; }
        a { margin-left: 10px; color: #555; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Are you sure you want to delete "{{ student.name }}"?</h3>
        <form method="POST">
            {% csrf_token %}
            <button type="submit">Yes, Delete</button>
            <a href="{% url 'student_list' %}">Cancel</a>
        </form>
    </div>

</body>
</html>
